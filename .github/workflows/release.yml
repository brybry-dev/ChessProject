name: Release

# Exécutables Windows, macOS et Linux (J6.2) : construits et testés à chaque tag de
# version, puis publiés dans une release GitHub avec les notes du CHANGELOG (J6.4).
# Lancé à la main (onglet Actions, « Run workflow ») sur master avec « publier » coché,
# il crée aussi le tag v<version> et la release : utile quand on ne peut pas pousser de
# tag. Sans cette case, ou sur une PR qui touche à l'empaquetage, il construit et teste
# sans publier.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/build_exe.py"
      - "chessproject/__main__.py"
      - "chessproject/assets/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier la release v<version du paquet> (depuis master uniquement)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Exécutable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux : glibc 2.35, pour tourner aussi sur les distributions un peu anciennes.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation
        run: python -m pip install -e ".[build]"

      - name: Version du tag = version du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import chessproject; print(chessproject.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} différent de la version du paquet ($version)"; exit 1; }

      - name: Construction et test de démarrage
        run: python tools/build_exe.py --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: chessproject-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publication
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish
          && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag de la version
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' chessproject/__init__.py)
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Notes de version
        run: python tools/release_notes.py "${{ steps.tag.outputs.name }}" > notes.md

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        # Release déjà créée à la main dans l'interface (ce qui crée aussi le tag) : on y
        # ajoute les exécutables. Sinon on la crée ; lancé à la main, gh crée alors le tag
        # sur le commit construit.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "ChessProject $TAG" \
              --notes-file notes.md --target "${GITHUB_SHA}"
          fi
