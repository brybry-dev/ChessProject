name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: python -m mypy .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Large : l'attente d'une machine macOS (environ 10 min observées) compte dans ce délai.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation
        run: python -m pip install -e ".[dev]"

      - name: pytest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest -q --durations=10

      # Couverture (J12.1) : mesurée sur une seule combinaison, publiée dans le résumé de
      # la tâche à chaque push ; seuil bloquant sur le moteur de règles (core).
      - name: pytest avec couverture
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pytest -q --durations=10 --cov --cov-report=json

      - name: Couverture par paquet, seuil de core (90 %)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: >-
          python tools/coverage_report.py coverage.json --core-min 90
          --summary "$GITHUB_STEP_SUMMARY" --badge coverage-badge.json

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage-badge
          path: coverage-badge.json
          if-no-files-found: error

  coverage-badge:
    name: Badge de couverture
    # Sur master seulement : le badge du README reflète la branche principale.
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badge

      # Branche « badges » à un seul commit, réécrite à chaque fois : le README lit
      # coverage.json par raw.githubusercontent.com (badge « endpoint » de shields.io).
      - name: Publication sur la branche badges
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: badge
        run: |
          mv coverage-badge.json coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badge de couverture (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  executable:
    name: Exécutable (Linux, test de démarrage)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installation
        run: python -m pip install -e ".[build]"

      - name: Construction et test de démarrage
        run: python tools/build_exe.py --smoke-test
