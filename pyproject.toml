[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chessproject"
version = "0.1.0"
description = "Jeu d'échecs en Python / Pygame avec une IA NegaMax."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame==2.6.1",
    "numpy==2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Moteur de référence pour les tests différentiels de génération de coups (J2.1)
    # "python-chess>=1.11",
]

[tool.setuptools]
py-modules = ["ChessAI", "ChessEngine", "ChessMain", "fen_utils", "serialization"]

# --------------------------------------------------------------------------
# Lint et formatage
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = [
    "SIM102",  # if imbriqués : gardés quand ils suivent la structure des règles
    "SIM108",  # ternaires : pas imposés quand le if/else est plus lisible
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E402"]  # les tests fixent SDL_VIDEODRIVER avant d'importer pygame

# --------------------------------------------------------------------------
# Typage : strict sur le moteur, souple sur l'UI et les tests (cf. rapport §4, J0.1)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ChessEngine", "ChessAI", "fen_utils", "serialization"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-m 'not slow'"
markers = [
    "slow: tests longs (perft profond, ~150 s), lancés avec `pytest -m slow`",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated:DeprecationWarning",
]
